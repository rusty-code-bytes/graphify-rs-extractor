[package]
name = "graphify-rust-extractor"
version = "0.1.0"
edition = "2024"
description = "Disk-backed PHP, SQL and HTML structural graph extractor"
license = "MIT"

[lib]
name = "graphify_extractor"

[[bin]]
name = "graphify-extractor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlparser = "0.59"
tempfile = "3"
tree-sitter = "0.25"
tree-sitter-php = { version = "0.24.2", path = "vendor/tree-sitter-php" }

[profile.release]
lto = "thin"
codegen-units = 1

